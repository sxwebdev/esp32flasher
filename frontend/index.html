<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ESP32 Flasher</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M8 3v3M12 3v3M16 3v3M8 18v3M12 18v3M16 18v3M3 8h3M3 12h3M3 16h3M18 8h3M18 12h3M18 16h3" />
            <rect x="6" y="6" width="12" height="12" rx="2" />
            <path d="M10 10h4v4h-4z" />
          </svg>
        </div>
        <div class="brand-copy">
          <div class="brand-line">
            <h1>ESP32 FLASHER</h1>
            <span id="appVersion" class="version-tag" data-i18n="brand.version">VERSION</span>
          </div>
          <p data-i18n="brand.subtitle">Firmware deployment console</p>
        </div>
        <button id="btnUpdate" class="update-button" type="button" hidden>
          <span class="update-indicator" aria-hidden="true"></span>
          <span data-i18n="update.available">Update available</span>
        </button>
        <div class="system-status" id="systemStatus">
          <span class="status-led" aria-hidden="true"></span>
          <span data-i18n="status.ready">System ready</span>
        </div>
      </header>

      <main class="workspace">
        <section class="panel setup-panel" aria-labelledby="setupTitle">
          <div class="panel-header">
            <div>
              <span class="eyebrow" data-i18n="setup.configuration">Configuration</span>
              <h2 id="setupTitle" data-i18n="setup.device">Device</h2>
            </div>
            <span class="panel-index">01</span>
          </div>

          <div class="field-group">
            <label class="label" for="portSelect" data-i18n="setup.serialPort">Serial port</label>
            <div class="input-row port-row">
              <select id="portSelect" class="select"></select>
              <button
                id="btnRefresh"
                class="btn btn-icon"
                type="button"
                data-i18n-title="setup.refreshPorts"
                data-i18n-aria-label="setup.refreshPorts"
                title="Refresh port list"
                aria-label="Refresh port list"
              >
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M20 7v5h-5M4 17v-5h5" />
                  <path d="M6.1 9A7 7 0 0 1 18 6l2 2M17.9 15A7 7 0 0 1 6 18l-2-2" />
                </svg>
              </button>
            </div>
          </div>

          <div class="field-group">
            <label class="label" for="baudSelect" data-i18n="setup.portSpeed">Port speed</label>
            <div class="select-with-unit">
              <select id="baudSelect" class="select">
                <option value="9600">9 600</option>
                <option value="115200" selected>115 200</option>
                <option value="460800">460 800</option>
                <option value="921600">921 600</option>
              </select>
              <span data-i18n="setup.baud">BAUD</span>
            </div>
          </div>

          <div class="section-rule"></div>

          <div class="field-group firmware-group">
            <label class="label" for="filePath" data-i18n="setup.firmwareImage">Firmware image</label>
            <div class="file-control">
              <div class="file-path-wrap">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                  <path d="M14 2v6h6M8 13h8M8 17h6" />
                </svg>
                <input
                  type="text"
                  id="filePath"
                  readonly
                  class="input file-input"
                  data-i18n-placeholder="setup.noFile"
                  placeholder="No file selected"
                />
              </div>
              <button id="btnChoose" class="btn btn-secondary" type="button">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" />
                  <path d="M3 7V5a2 2 0 0 1 2-2h4l2 2h6" />
                </svg>
                <span data-i18n="setup.selectBin">Select .bin</span>
              </button>
            </div>
            <p class="field-hint" data-i18n="setup.writeAddressHint">The write address is detected automatically</p>
          </div>

          <button id="btnFlash" class="btn btn-primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m13 2-9 12h8l-1 8 9-12h-8l1-8z" />
            </svg>
            <span data-i18n="setup.flashFirmware">Flash firmware</span>
            <kbd data-i18n="keyboard.enter">ENTER</kbd>
          </button>

          <div id="progressContainer" class="progress-container" hidden>
            <div class="progress-meta">
              <span data-i18n="progress.writingFlash">Writing Flash</span>
              <span id="progressText" class="progress-text">0%</span>
            </div>
            <div class="progress-bar">
              <div id="progressBar" class="progress-fill"></div>
            </div>
          </div>
        </section>

        <section class="panel terminal-panel" aria-labelledby="terminalTitle">
          <div class="terminal-header">
            <div class="terminal-title">
              <span class="terminal-icon" aria-hidden="true">›_</span>
              <div>
                <span class="eyebrow" data-i18n="terminal.deviceOutput">Device output</span>
                <h2 id="terminalTitle" data-i18n="terminal.serialConsole">Serial console</h2>
              </div>
            </div>
            <div class="log-controls">
              <button id="btnMonitor" class="btn btn-tool" type="button">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M8 5v14M16 5v14M4 9h4M16 9h4M4 15h4M16 15h4" />
                </svg>
                <span data-i18n="terminal.monitor">Monitor</span>
              </button>
              <button id="btnStopMonitor" class="btn btn-tool btn-stop" type="button" hidden>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="6" y="6" width="12" height="12" rx="1" />
                </svg>
                <span data-i18n="terminal.stop">Stop</span>
              </button>
              <button
                id="btnAutoScroll"
                class="btn btn-tool btn-toggle active"
                type="button"
                aria-pressed="true"
                data-i18n-title="terminal.autoScrollTitle"
                title="Automatic scrolling"
              >
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 4v14M7 13l5 5 5-5" />
                </svg>
                <span data-i18n="terminal.autoScroll">Auto-scroll</span>
              </button>
              <button
                id="btnClearLog"
                class="btn btn-icon btn-ghost"
                type="button"
                data-i18n-title="terminal.clearConsole"
                data-i18n-aria-label="terminal.clearConsole"
                title="Clear console"
                aria-label="Clear console"
              >
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4 7h16M10 11v6M14 11v6M9 7l1-3h4l1 3M6 7l1 14h10l1-14" />
                </svg>
              </button>
            </div>
          </div>

          <div class="terminal-body">
            <div class="terminal-gutter" aria-hidden="true">
              <span>TX</span>
              <span>RX</span>
            </div>
            <pre id="log" class="log" aria-live="off"></pre>
          </div>
          <div class="terminal-footer">
            <span><i class="footer-dot"></i> <span data-i18n="terminal.binaryGuard">UTF-8 / BINARY GUARD</span></span>
            <span id="logCounter">0 lines</span>
          </div>
        </section>
      </main>
    </div>

    <script src="./src/main.js" type="module"></script>
  </body>
</html>
