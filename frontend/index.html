<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ESP32 Flasher</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="container">
      <main class="main-content">
        <div class="control-group">
          <label class="label">COM Port:</label>
          <div class="input-row">
            <select id="portSelect" class="select"></select>
            <select id="baudSelect" class="select" style="max-width: 120px">
              <option value="9600">9600</option>
              <option value="115200" selected>115200</option>
              <option value="460800">460800</option>
              <option value="921600">921600</option>
            </select>
            <button id="btnRefresh" class="btn btn-secondary">🔄</button>
          </div>
        </div>

        <div class="control-group">
          <label class="label">Firmware file (.bin):</label>
          <div class="input-row">
            <input
              type="text"
              id="filePath"
              readonly
              class="input file-input"
              placeholder="Select file..."
            />
            <button id="btnChoose" class="btn btn-secondary">📁 Browse</button>
          </div>
        </div>

        <div class="control-group">
          <label class="label">Flash address:</label>
          <div class="input-row">
            <select id="offsetSelect" class="select">
              <option value="0x0">0x0 - Full image</option>
              <option value="0x1000">0x1000 - Bootloader</option>
              <option value="0x8000">0x8000 - Partitions</option>
              <option value="0x10000" selected>0x10000 - App</option>
              <option value="custom">Custom...</option>
            </select>
            <input
              type="text"
              id="customOffset"
              class="input"
              placeholder="0x..."
              style="display: none; max-width: 120px"
            />
          </div>
        </div>

        <div class="control-group">
          <button id="btnFlash" class="btn btn-primary">⚡ Flash ESP32</button>
        </div>

        <div
          id="progressContainer"
          class="progress-container"
          style="display: none"
        >
          <label class="label">Flash progress:</label>
          <div class="progress-bar-wrapper">
            <div class="progress-bar">
              <div id="progressBar" class="progress-fill"></div>
            </div>
            <span id="progressText" class="progress-text">0%</span>
          </div>
        </div>

        <div class="log-container">
          <div class="log-header">
            <label class="label">Log:</label>
            <div class="log-controls">
              <button id="btnMonitor" class="btn btn-compact">
                🔍 Monitor
              </button>
              <button
                id="btnStopMonitor"
                class="btn btn-compact btn-stop"
                style="display: none"
              >
                ⏹ Stop
              </button>
              <button
                id="btnAutoScroll"
                class="btn btn-compact btn-toggle active"
              >
                📜 Auto
              </button>
              <button id="btnCopyLog" class="btn btn-compact">📋 Copy</button>
              <button id="btnClearLog" class="btn btn-compact">🗑 Clear</button>
            </div>
          </div>
          <pre id="log" class="log"></pre>
        </div>
      </main>
    </div>

    <script src="./src/main.js" type="module"></script>
  </body>
</html>
