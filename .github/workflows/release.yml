name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin/amd64
            runner: macos-15-intel
            artifact: espflasher-darwin-amd64
          - platform: darwin/arm64
            runner: macos-15
            artifact: espflasher-darwin-arm64
          - platform: windows/amd64
            runner: windows-latest
            artifact: espflasher-windows-amd64
          - platform: windows/arm64
            runner: windows-11-arm
            artifact: espflasher-windows-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Ensure NSIS is installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            choco install nsis --yes --no-progress
            $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          }
          if (-not $makensis) {
            throw "NSIS installation completed, but makensis.exe is not available on PATH"
          }
          & $makensis.Source -VERSION

      - name: Set release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const file = "wails.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.info.productVersion = process.env.RELEASE_TAG.replace(/^v/, "");
            fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
          '

      - name: Build application
        shell: bash
        env:
          CGO_LDFLAGS: ${{ startsWith(matrix.platform, 'darwin/') && '-framework UniformTypeIdentifiers' || '' }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          EXTRA_FLAGS=""
          if [[ "${{ matrix.platform }}" == windows/* ]]; then
            EXTRA_FLAGS="-nsis -installscope user"
          fi
          wails build -clean -trimpath -platform "${{ matrix.platform }}" \
            -ldflags "-X main.appVersion=${VERSION}" ${EXTRA_FLAGS}

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/espflasher.app \
            "dist/${{ matrix.artifact }}.zip"

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $arch = "${{ matrix.platform }}".Split("/")[-1]
          $source = "build/bin/espflasher-$arch-installer.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            Get-ChildItem -Path build/bin -Force | Format-Table -AutoSize
            throw "Wails did not create the expected NSIS installer: $source"
          }
          Copy-Item -LiteralPath $source "dist/${{ matrix.artifact }}-installer.exe"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: espflasher-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
